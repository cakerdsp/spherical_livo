    time_offset: 0.001901867458041627
  camera4:
    img_topic: "/alphasense/cam2/image_raw"
    camera_ns: "camera4"
    Rcl: [-0.0042340516721277015, -0.9999897552434941, 0.0016006918802386892, 0.9999871881804255, -0.004238470700886935, -0.0027674611333545654, 0.0027742172670246527, 0.0015889537990238962, 0.9999948894591316]
    Pcl: [-0.007986043407087256, 0.0007666033304289197, -0.08909935434931215]
    time_offset: 0.001939579925335353
extrin_calib:
  # Unused legacy single-camera field; see cameras/cameraN/Rcl.
  Rcl: []
  # Unused legacy single-camera field; see cameras/cameraN/Pcl.
  Pcl: []
  extrinsic_T: [-0.001, -0.00855, 0.055]
  extrinsic_R: [0, -1, 0, -1, 0, 0, 0, 0, -1]
time_offset:
  img_time_offset: 0.0
  exposure_time_init: 0.0
  imu_time_offset: 0.0
  lidar_time_offset: 0.0
preprocess:
  feature_extract_enabled: false
  scan_rate: 10
  hilti_en: false
  lidar_type: 5
  scan_line: 32
  point_filter_num: 3
  blind: 0.6
  filter_size_surf: 0.1
visual:
  patch_radius_deg: 1.0
  patch_samples: 48
  max_patches: 120
imu:
  ba_bg_est_en: true
  gravity_est_en: true
  imu_en: true
  imu_int_frame: 100
  acc_cov: 0.5
  gyr_cov: 0.01
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  sigma_num: 3.0
  min_eigen_value: 0.001
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
local_map:
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 8.0
publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.01
  pub_plane_en: false

vio:
  # Fixed true by the spherical frontend.
  normal_en: true
  # Fixed false by the spherical frontend.
  inverse_composition_en: false
  max_iterations: 5
  # Photometric measurement covariance in the EKF.
  img_point_cov: 100
  # Fixed false by the spherical frontend.
  raycast_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.2
  # Legacy field; global Top-K selection does not use pixel grids.
  grid_size: 5
  # Legacy field; global Top-K selection does not use pixel grids.
  grid_n_height: 17
  # VIO optimization levels, coarse to fine; upstream spelling retained.
  patch_pyrimid_level: 3
  # Legacy field; spherical sample count is visual/patch_samples.
  patch_size: 8
  # Maximum mean squared patch photometric residual.
  outlier_threshold: 1000

uav:
  gravity_align_en: false
  imu_rate_odom: false

evo:
  # Also enabled when output_dir is nonempty.
  pose_output_en: false
  seq_name: "01"

pcd_save:
  filter_size_pcd: 0.5
  # Fixed false by the spherical frontend.
  colmap_output_en: false
  type: 0
  pcd_save_en: false
  interval: -1

image_save:
  interval: 1
  img_save_en: false

debug:
  frame_cnt: 6
  plot_time: -10
# Launch output_dir argument overrides this; nonempty enables pose output.
output_dir: ""
