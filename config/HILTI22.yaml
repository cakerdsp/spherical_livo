# Calibration derived from Hilti-Research/hilti-slam-challenge-2022, CC BY-NC-SA 3.0.
# Attribution and exact source files: docs/calibration_sources.md.
# Internal camera0..4 map to physical C0,C3,C4,C1,C2; first N are active.
# T_CL = T_CI * T_IL; t_corrected = t_image + timeshift_cam_imu.
# Static untested defaults. Each camera uses its own official calibration.
common:
  # Legacy field; subscriptions use cameras/cameraN/img_topic.
  img_topic: "/left_camera/image"
  lidar_en: 1
  img_en: 1
  ros_driver_bug_fix: false
  multi_cam_sync_tolerance_ms: 1.0
  num_cameras: 3
  lid_topic: "/hesai/pandar"
  imu_topic: "/alphasense/imu"
cameras:
  camera0:
    img_topic: "/alphasense/cam0/image_raw"
    camera_ns: "camera0"
    Rcl: [-0.9999264200621176, -0.006708021451800439, 0.01010727015365992, -0.010091197021688258, -0.002425643641803532, -0.9999461405473755, 0.00673217679702115, -0.9999745590269407, 0.0023577731969991467]
    Pcl: [-0.05497620466498117, 0.0675401455352659, -0.05205992090186603]
    time_offset: 0.0019071204237431304
  camera1:
    img_topic: "/alphasense/cam3/image_raw"
    camera_ns: "camera1"
    Rcl: [-0.007396041673023157, 0.9998916894135631, -0.01272430781071447, 0.002363530935315569, -0.01270714046408309, -0.9999164676625464, -0.9999698556902047, -0.007425498159515405, -0.002269292399476633]
    Pcl: [-0.0013880731573544423, 0.06618357503169384, -0.06561545010336364]
    time_offset: 0.0018128742099424312
  camera2:
    img_topic: "/alphasense/cam4/image_raw"
    camera_ns: "camera2"
    Rcl: [0.000942427662931895, -0.9999880402484476, 0.004799082221662863, 0.0021900897852221157, -0.004797008865106434, -0.9999860960096802, 0.9999971576643774, 0.0009529249803788974, 0.0021855427584387965]
    Pcl: [0.005160367447034718, 0.0717138089488167, -0.06644965352255408]
    time_offset: 0.0017123033924705262
  camera3:
    img_topic: "/alphasense/cam1/image_raw"
    camera_ns: "camera3"
    Rcl: [-0.9999840642813064, -0.0016556126470597954, 0.005397233569448934, -0.005395690615039778, -0.0009350089535379302, -0.9999850060281122, 0.0016606342845620903, -0.9999981923508761, 0.0009260608798763448]
