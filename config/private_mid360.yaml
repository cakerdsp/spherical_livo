# Private MID360 + two raw MEI views. Calibration from cake_slam, unchanged.
# Type 8 is Livox PointCloud2 here; type 7 remains upstream Robosense.
# Point field aliases and time normalization follow cake_slam.
# Missing/non-varying point time uses its scan_rate-based approximation.
# Defaults are reasoned starting values, not replay-tuned. See docs/deployment_ros1_zh.md.
common:
  # Legacy field; subscriptions use cameras/cameraN/img_topic.
  img_topic: "/left_camera/image"
  lidar_en: 1
  img_en: 1
  ros_driver_bug_fix: false
  multi_cam_sync_tolerance_ms: 40.0
  num_cameras: 2
  lid_topic: "/livox/lidar"
  imu_topic: "/livox/imu"
cameras:
  camera0:
    img_topic: "/fisheye/left/image_raw"
    camera_ns: "camera0"
    Rcl: [0.703459, -0.710716, -0.005384, -0.006562, 0.001081, -0.999978, 0.710706, 0.703478, -0.003903]
    Pcl: [0.017582, 0.023607, -0.037925]
    time_offset: 0.0
  camera1:
    img_topic: "/fisheye/right/image_raw"
    camera_ns: "camera1"
    Rcl: [-0.717462, -0.695831, 0.032667, -0.026026, -0.020086, -0.999459, 0.696111, -0.717925, -0.003699]
    Pcl: [0.017541, 0.039816, -0.033913]
    time_offset: 0.0
extrin_calib:
  # Unused legacy single-camera field; see cameras/cameraN/Rcl.
  Rcl: []
  # Unused legacy single-camera field; see cameras/cameraN/Pcl.
  Pcl: []
  extrinsic_T: [-0.011, -0.02329, 0.04412]
  extrinsic_R: [1, 0, 0, 0, 1, 0, 0, 0, 1]
time_offset:
  img_time_offset: 0.0
  exposure_time_init: 0.0
  imu_time_offset: 0.0
  lidar_time_offset: 0.0
preprocess:
  feature_extract_enabled: false
  hilti_en: false
  lidar_type: 8
  scan_line: 4
  scan_rate: 10
  point_filter_num: 3
  blind: 0.8
  filter_size_surf: 0.1
visual:
  patch_radius_deg: 0.9
  patch_samples: 48
  max_patches: 120
imu:
  ba_bg_est_en: true
  gravity_est_en: true
  imu_en: true
  imu_int_frame: 100
  acc_cov: 0.5
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.05
  sigma_num: 3.0
  min_eigen_value: 0.0025
  voxel_size: 0.5
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
local_map:
  map_sliding_en: true
  half_map_size: 100
  sliding_thresh: 8.0
publish:
  dense_map_en: false
  pub_effect_point_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.01
  pub_plane_en: false

vio:
  # Fixed true by the spherical frontend.
  normal_en: true
  # Fixed false by the spherical frontend.
  inverse_composition_en: false
  max_iterations: 5
  # Photometric measurement covariance in the EKF.
  img_point_cov: 100
  # Fixed false by the spherical frontend.
  raycast_en: false
  exposure_estimate_en: true
  inv_expo_cov: 0.2
  # >10: cell size in pixels; <=10: derive from image height / grid_n_height.
  grid_size: 5
  # Target grid rows when grid_size <=10; one representative per cell before Top-K.
  grid_n_height: 17
  # VIO optimization levels, coarse to fine; upstream spelling retained.
  patch_pyrimid_level: 3
  # Legacy field; spherical sample count is visual/patch_samples.
  patch_size: 8
  # Maximum mean squared patch photometric residual.
  outlier_threshold: 1000

uav:
  gravity_align_en: false
  imu_rate_odom: false

evo:
  # Also enabled when output_dir is nonempty.
  pose_output_en: false
  seq_name: "01"

pcd_save:
  filter_size_pcd: 0.5
  # Fixed false by the spherical frontend.
  colmap_output_en: false
  type: 0
  pcd_save_en: false
  interval: -1

image_save:
  interval: 1
  img_save_en: false

debug:
  frame_cnt: 6
  plot_time: -10
# Launch output_dir argument overrides this; nonempty enables pose output.
output_dir: ""
